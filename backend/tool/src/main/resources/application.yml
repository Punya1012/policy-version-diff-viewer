spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tooldb
    username: postgres
    password: word
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: admin
      password: admin

server:
  port: 8080
  spring:
    datasource:
      url: jdbc:postgresql://localhost:5432/tooldb
      username: postgres
      password: word
    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
    flyway:
      enabled: true
      locations: classpath:db/migration
    security:
      user:
        name: admin
        password: admin
    servlet:
      multipart:
        enabled: true
        max-file-size: 5MB
        max-request-size: 5MB

  server:
    port: 8080